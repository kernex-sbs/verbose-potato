services:
  main:
    command: ["/usr/local/bin/evalstack-entrypoint"]
    environment:
      EVALSTACK_DATABASE_URL: postgresql://evalstack:evalstack@postgres:5432/evalstack
      EVALSTACK_REDIS_URL: redis://redis:6379/0
      EVALSTACK_HTTP_HOST: 0.0.0.0
      EVALSTACK_HTTP_PORT: "8080"
      EVALSTACK_SEED_INCIDENT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: evalstack
      POSTGRES_USER: evalstack
      POSTGRES_PASSWORD: evalstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalstack -d evalstack"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4.1-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
